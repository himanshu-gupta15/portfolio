<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0a0a0a" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.5"/>
