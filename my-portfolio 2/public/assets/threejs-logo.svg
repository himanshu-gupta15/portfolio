  <line x1="8" y1="50" x2="44" y2="30" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="56" y1="50" x2="20" y2="30" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Center point -->
  <circle cx="32" cy="37" r="2" fill="white" opacity="0.7"/>
</svg>
