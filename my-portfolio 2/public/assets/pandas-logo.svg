<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#100820" stroke="#E70488" stroke-width="2.5"/>
  <!-- Panda face -->
  <!-- Ear patches (black) -->
  <ellipse cx="22" cy="20" rx="7" ry="7" fill="#FFFFFF"/>
  <ellipse cx="42" cy="20" rx="7" ry="7" fill="#FFFFFF"/>
  <!-- Ear inner dark patches -->
  <ellipse cx="22" cy="20" rx="5" ry="5" fill="#1A1A2E"/>
  <ellipse cx="42" cy="20" rx="5" ry="5" fill="#1A1A2E"/>
  <!-- Face -->
  <ellipse cx="32" cy="36" rx="18" ry="16" fill="#FFFFFF"/>
  <!-- Eye patches -->
  <ellipse cx="25" cy="30" rx="6" ry="5" fill="#1A1A2E"/>
  <ellipse cx="39" cy="30" rx="6" ry="5" fill="#1A1A2E"/>
  <!-- Eyes white -->
  <circle cx="26" cy="29" r="2" fill="white"/>
  <circle cx="40" cy="29" r="2" fill="white"/>
  <!-- Eyes pupils -->
  <circle cx="26.5" cy="29.5" r="1.2" fill="#1A1A2E"/>
  <circle cx="40.5" cy="29.5" r="1.2" fill="#1A1A2E"/>
